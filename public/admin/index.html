<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Admin — Aminul Islam</title>
    <meta name="robots" content="noindex" />
    <!-- This page is served at /admin (no trailing slash, via the next.config.ts
         rewrite) as well as /admin/index.html directly. Without a fixed <base>,
         Decap's relative "config.yml" fetch resolves against whatever's in the
         browser's address bar — at "/admin" that's a sibling path, "/config.yml",
         which 404s. Pinning the base here makes it resolve correctly either way. -->
    <base href="/admin/" />
    <!-- Cosmetic skin for the login screen only — see admin.css for why
         this is safe against a future Decap CMS version bump. -->
    <link rel="stylesheet" href="admin.css" />
  </head>
  <body>
    <!-- Decap CMS (formerly Netlify CMS) loaded from CDN — see public/admin/config.yml
         for the content model, and src/app/api/auth/route.ts + callback for the
         GitHub OAuth login this page uses to sign in. -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
